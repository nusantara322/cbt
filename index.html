<script>
/* ======================================================================
 *  CBT NUSANTARA - Frontend
 *  Isi API_URL dengan URL Web App Google Apps Script (.../exec).
 *  Jika dikosongkan, aplikasi berjalan dalam MODE DEMO (data lokal di browser).
 * ====================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxEn2e_VOz_4X_h-3U-7IK6AReJnWOwbCi4AYPsS8ROo-kNPLfeTnKl0XVAbccOVnMYRA/exec';
const HEARTBEAT_MS = 20000;      // sinkron status ujian siswa ke server
const MONITOR_MS = 8000;         // refresh tabel monitoring admin
const DASH_REFRESH_MS = 20000;   // refresh daftar ujian di dashboard siswa
// Di HP/tablet, browser sering melepas layar penuh sendiri (keyboard, gestur kembali, bilah alamat).
// false = keluar layar penuh di HP tidak dihitung pelanggaran (hanya diminta kembali). true = dihitung seperti di komputer.
const MOBILE_FULLSCREEN_STRICT = false;

/* ---------------------------- util ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, c = 'w-5 h-5') => `<i data-lucide="${n}" class="${c}"></i>`;
const paint = () => window.lucide && lucide.createIcons();
const timers = {};
const clearTimers = (...names) => (names.length ? names : Object.keys(timers)).forEach(n => { clearInterval(timers[n]); delete timers[n]; });
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0'); return (h ? p(h) + ':' : '') + p(m) + ':' + p(x); };

function normForm(raw) {
  let u = String(raw || '').trim();
  const m = u.match(/src\s*=\s*["']([^"']+)["']/i); if (m) u = m[1];
  u = u.replace(/&amp;/g, '&');
  if (!/^https:\/\/(docs\.google\.com\/forms\/|forms\.gle\/)/i.test(u)) throw new Error('Link harus berupa Google Form (https://docs.google.com/forms/... atau https://forms.gle/...)');
  if (/\/viewform/i.test(u) && !/[?&]embedded=true/i.test(u)) u += (u.includes('?') ? '&' : '?') + 'embedded=true';
  return u;
}

/* ---------------------------- kelas ("11", "XI", "11 IPA", "XI IPA 1" setara) ---------------------------- */
const ROMAN = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7, VIII: 8, IX: 9, X: 10, XI: 11, XII: 12, XIII: 13 };
function kelasTokens(v) {
  const t = String(v == null ? '' : v).toUpperCase().replace(/(\d)([A-Z])/g, '$1 $2').replace(/([A-Z])(\d)/g, '$1 $2').replace(/[^A-Z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  if (t.length && ROMAN[t[0]]) t[0] = String(ROMAN[t[0]]);
  return t;
}
function kelasMatch(ek, sk) {                    // sama dengan di server (dipakai mode demo)
  const en = String(ek == null ? '' : ek).split(/[,;\n]+/).map(kelasTokens).filter(t => t.length);
  if (!en.length) return true;
  const s = kelasTokens(sk);
  return en.some(e => e.length <= s.length && e.every((tok, i) => tok === s[i]));
}

/* ---------------------------- layar penuh (lintas browser) ---------------------------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsSupported = () => { const d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); };   // iPhone Safari/Chrome: tidak ada
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const IS_TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse) and (hover: none)').matches);
const IN_APP_BROWSER = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok|WhatsApp|; wv\)/i.test(navigator.userAgent);
const fsNeeded = () => fsSupported() && !isStandalone();
function enterFs() {                     // aman dipanggil di browser apa pun; selalu mengembalikan Promise<boolean>
  const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!f) return Promise.resolve(false);
  try { return Promise.resolve(f.call(d, { navigationUI: 'hide' })).then(() => true, () => false); } catch { return Promise.resolve(false); }
}
function exitFs() {
  const f = document.exitFullscreen || document.webkitExitFullscreen;
  if (f && fsEl()) { try { Promise.resolve(f.call(document)).catch(() => { }); } catch { } }
}

/* ---------------------------- teks kaya: rumus matematika, tebal, garis bawah ---------------------------- */
/* $...$ = rumus sebaris, $$...$$ = rumus satu baris penuh, **tebal**, __garis bawah__. Semua teks di-escape lebih dulu. */
function mathSpan(latex, display, raw) {
  if (window.katex) {
    try { return window.katex.renderToString(latex, { throwOnError: false, displayMode: display, trust: false, strict: 'ignore' }); } catch (e) { /* jatuh ke teks biasa */ }
  }
  return `<code class="font-mono text-indigo-200">${esc(raw)}</code>`;   // KaTeX belum termuat: tampilkan rumus apa adanya
}
function richHtml(src) {
  src = String(src == null ? '' : src);
  const plain = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/\n/g, '<br>');
  const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, out = []; let i = 0, m;
  while ((m = re.exec(src))) {
    if (m.index > i) out.push(plain(src.slice(i, m.index)));
    out.push(mathSpan(m[1] !== undefined ? m[1] : m[2], m[1] !== undefined, m[0]));
    i = m.index + m[0].length;
  }
  if (i < src.length) out.push(plain(src.slice(i)));
  return out.join('');
}

/* ---------------------------- gambar soal (disimpan di server, diambil lewat sesi login) ---------------------------- */
const IMG = {};                                           // id -> data URL
const imgHtml = (id, cls) => id ? `<img data-img="${esc(id)}" class="qimg ${cls || ''}" alt="Gambar soal" ${IMG[id] ? `src="${IMG[id]}"` : ''}>` : '';
function fillImgs(root) { (root || document).querySelectorAll('img[data-img]').forEach(im => { if (!im.getAttribute('src') && IMG[im.dataset.img]) im.src = IMG[im.dataset.img]; }); }
async function loadImages(ids, idUjian, root) {
  const need = [...new Set((ids || []).filter(Boolean))].filter(id => !IMG[id]);
  for (let i = 0; i < need.length; i += 6) {
    try { const r = await api('getImages', { token: S.token, idUjian, ids: need.slice(i, i + 6) }); Object.assign(IMG, r.images); } catch (e) { /* dicoba lagi saat soal dibuka */ }
    fillImgs(root);
  }
  fillImgs(root);
}
const imageIdsOf = soal => { const m = {}; (soal || []).forEach(q => { if (q.gambar) m[q.gambar] = 1; (q.opsi || []).forEach(o => { if (o.g) m[o.g] = 1; }); }); return Object.keys(m); };

async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) { /* coba cara lain */ } }
  return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => no(new Error('Gambar tidak bisa dibaca.')); im.src = u; });
}
async function compressImage(file) {                      // kecilkan agar cepat dimuat siswa dan muat di sel Google Sheets
  const bmp = await loadBitmap(file), w0 = bmp.width, h0 = bmp.height;
  let scale = Math.min(1, 1100 / Math.max(w0, h0)), q = 0.85, data = '';
  for (let k = 0; k < 7; k++) {
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0 * scale)); cv.height = Math.max(1, Math.round(h0 * scale));
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    data = cv.toDataURL('image/jpeg', q);
    if (data.length < 300000) break;
    q = Math.max(0.5, q - 0.1); scale *= 0.85;
  }
  if (data.length >= 420000) throw new Error('Gambar terlalu besar. Perkecil gambarnya lalu coba lagi.');
  return data;
}
async function uploadImage(file) {
  if (!/^image\//.test(file.type)) throw new Error('File harus berupa gambar (JPG, PNG, atau WebP).');
  const du = await compressImage(file);
  const r = await api('adminUploadImage', { token: S.token, mime: 'image/jpeg', data: du.split(',')[1] });
  IMG[r.id] = du; return r.id;
}

/* ---------------------------- palet simbol & fungsi matematika untuk guru ---------------------------- */
/* Format item: [tampilan, LaTeX]. Tanda ‸ = posisi kursor setelah disisipkan (atau pembungkus teks yang diblok). */
const PALETTE = [
  ['Dasar', [['±', '\\pm'], ['×', '\\times'], ['÷', '\\div'], ['·', '\\cdot'], ['≠', '\\neq'], ['≤', '\\leq'], ['≥', '\\geq'], ['≈', '\\approx'], ['∞', '\\infty'], ['π', '\\pi'], ['°', '^{\\circ}'], ['%', '\\%']]],
  ['Struktur', [['a/b', '\\frac{‸}{}'], ['√', '\\sqrt{‸}'], ['ⁿ√', '\\sqrt[n]{‸}'], ['x²', '^{2}'], ['xⁿ', '^{‸}'], ['xₙ', '_{‸}'], ['( )', '\\left(‸\\right)'], ['| |', '\\left|‸\\right|'], ['log', '\\log_{‸}'], ['sin', '\\sin '], ['cos', '\\cos '], ['tan', '\\tan ']]],
  ['Kalkulus', [['∫', '\\int_{‸}^{}'], ['Σ', '\\sum_{i=1}^{n}‸'], ['lim', '\\lim_{x \\to ‸}'], ['d/dx', '\\frac{d}{dx}‸'], ['∂', '\\partial '], ['Δ', '\\Delta '], ['→', '\\to ']]],
  ['Yunani', [['α', '\\alpha '], ['β', '\\beta '], ['γ', '\\gamma '], ['δ', '\\delta '], ['ε', '\\varepsilon '], ['θ', '\\theta '], ['λ', '\\lambda '], ['μ', '\\mu '], ['ρ', '\\rho '], ['σ', '\\sigma '], ['φ', '\\phi '], ['ω', '\\omega '], ['Δ', '\\Delta '], ['Σ', '\\Sigma '], ['Ω', '\\Omega ']]],
  ['Himpunan', [['∈', '\\in '], ['∉', '\\notin '], ['∪', '\\cup '], ['∩', '\\cap '], ['⊂', '\\subset '], ['⊆', '\\subseteq '], ['∅', '\\emptyset '], ['ℝ', '\\mathbb{R}'], ['ℕ', '\\mathbb{N}'], ['ℤ', '\\mathbb{Z}'], ['⇒', '\\Rightarrow '], ['⇔', '\\Leftrightarrow '], ['∴', '\\therefore '], ['∀', '\\forall '], ['∃', '\\exists ']]],
  ['Geometri', [['∠', '\\angle '], ['⊥', '\\perp '], ['∥', '\\parallel '], ['△', '\\triangle '], ['≅', '\\cong '], ['∼', '\\sim '], ['vektor', '\\vec{‸}'], ['garis', '\\overline{‸}'], ['busur', '\\widehat{‸}']]],
  ['Matriks', [['2×2', '\\begin{pmatrix} ‸ &  \\\\  &  \\end{pmatrix}'], ['sistem', '\\begin{cases} ‸ \\\\  \\end{cases}'], ['det', '\\begin{vmatrix} ‸ &  \\\\  &  \\end{vmatrix}']]],
  ['Kimia/Fisika', [['H₂O', '\\mathrm{H_2O}'], ['CO₂', '\\mathrm{CO_2}'], ['→', '\\rightarrow '], ['⇌', '\\rightleftharpoons '], ['ΔH', '\\Delta H'], ['m/s²', '\\mathrm{m/s^2}'], ['µ', '\\mu ']]]
];
function insertSnippet(el, t, math) {
  const s = el.selectionStart, e = el.selectionEnd, v = el.value, sel = v.slice(s, e);
  const inside = ((v.slice(0, s).replace(/\\\$/g, '').match(/\$/g) || []).length % 2) === 1;     // kursor sedang di dalam $...$
  let ins = math && !inside ? '$' + t + '$' : t;
  if (sel && ins.indexOf('‸') >= 0) ins = ins.replace('‸', sel);                                // bungkus teks yang diblok
  const caret = ins.indexOf('‸'); ins = ins.replace('‸', '');
  el.value = v.slice(0, s) + ins + v.slice(e);
  const pos = s + (caret >= 0 ? caret : ins.length);
  el.focus(); el.setSelectionRange(pos, pos); el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------------------------- API ---------------------------- */
let pending = 0;
function loading(d) { pending += d; const b = $('#loadbar'); if (b) b.style.opacity = pending > 0 ? 1 : 0; }
async function httpOnce(url, opts) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  loading(1);
  const fail = (m) => { const e = new Error(m); e.transient = true; return e; };   // gangguan jaringan/server: boleh diulang
  try {
    let res; try { res = await fetch(url, { ...opts, signal: ctl.signal }); }
    catch (e) { throw e.name === 'AbortError' ? fail('Server terlalu lama merespons (lebih dari 30 detik).') : fail('Tidak bisa menghubungi server. Periksa internet, API_URL, dan akses deployment "Anyone".'); }
    const txt = await res.text(); let j;
    try { j = JSON.parse(txt); } catch { throw fail('Server mengembalikan halaman HTML, bukan data. Di Apps Script: Execute as "Me", akses "Anyone", lalu Deploy > New version.'); }
    if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan pada server.');
    return j;
  } finally { clearTimeout(to); loading(-1); }
}
async function http(url, opts, retries = 2) {
  for (let i = 0; ; i++) {
    try { const j = await httpOnce(url, opts); setConn('ok'); return j; }
    catch (e) {
      if (e.transient && i < retries) { await new Promise(r => setTimeout(r, 700 * (i + 1))); continue; }
      if (e.transient) setConn('off', e.message);
      throw e;
    }
  }
}
async function api(action, payload = {}) {
  if (!API_URL) return demoApi(action, payload);
  return http(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
}
async function apiGet(action) {
  if (!API_URL) return demoApi(action, {});
  return http(API_URL + '?action=' + encodeURIComponent(action));
}

function toast(msg, type = 'info', ms = 3800) {
  const map = { info: ['info', '#4F46E5'], ok: ['check-circle-2', '#10B981'], err: ['octagon-alert', '#EF4444'], warn: ['triangle-alert', '#F59E0B'] };
  const [ic, col] = map[type] || map.info;
  const el = document.createElement('div');
  el.className = 'glass pop rounded-xl px-4 py-3 flex gap-3 items-start text-sm shadow-xl';
  el.style.borderLeft = `3px solid ${col}`;
  el.innerHTML = `<span style="color:${col}">${icon(ic, 'w-5 h-5')}</span><div class="flex-1">${esc(msg)}</div>`;
  $('#toasts').appendChild(el); paint();
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = 0; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, ms);
}

function ask({ title, body = '', ic = 'help-circle', tone = 'brand', actions, onOpen }) {
  return new Promise(resolve => {
    const col = { brand: '#818CF8', bad: '#F87171', ok: '#34D399' }[tone];
    const root = document.createElement('div');
    root.className = 'fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm';
    root.innerHTML = `<div class="glass pop rounded-2xl p-6 w-full max-w-md" role="dialog" aria-modal="true">
      <div class="flex gap-3 items-start"><span style="color:${col}">${icon(ic, 'w-7 h-7')}</span>
      <div class="flex-1"><h3 class="text-lg font-bold">${esc(title)}</h3><div class="text-sm text-slate-300 mt-2 space-y-2">${body}</div></div></div>
      <div class="flex gap-2 justify-end mt-6 flex-wrap">${actions.map(a => `<button class="btn ${a.kind || 'btn-ghost'}" data-act="${a.id}" ${a.disabled ? 'disabled' : ''}>${esc(a.label)}</button>`).join('')}</div></div>`;
    $('#modal-root').appendChild(root); paint();
    const close = v => { root.remove(); resolve(v); };
    root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const a = actions.find(x => x.id === b.dataset.act); if (a && a.sync) a.sync(); close(b.dataset.act); });

  });
}

function busy(btn, on, label) {
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = `${icon('loader-circle', 'w-4 h-4 animate-spin')} ${esc(label || 'Memproses...')}`; paint(); }

function view(html) { clearTimers('dash', 'mon', 'cd'); const a = $('#app'); a.innerHTML = html; a.firstElementChild && a.firstElementChild.classList.add('view-in'); paint(); bindTilt(); updConn(); }

document.addEventListener('pointerdown', e => {            // efek ripple
  const b = e.target.closest('.btn'); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement('span');
  s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 600);
});
function bindTilt() {
  document.querySelectorAll('.tilt').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.style.setProperty('--rx', ((.5 - y) * 9) + 'deg'); el.style.setProperty('--ry', ((x - .5) * 11) + 'deg');
      el.style.setProperty('--mx', (x * 100) + '%'); el.style.setProperty('--my', (y * 100) + '%');
    });
    el.addEventListener('pointerleave', () => { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); });
  });
}

const nowMs = () => Date.now() + ((S && S.skew) || 0);       // jam server (bukan jam perangkat siswa)
function fmtWhen(ms, tz) {
  try { return new Date(ms).toLocaleString('id-ID', { timeZone: tz || undefined, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, ':').replace(',', ''); }
  catch { return new Date(ms).toLocaleString('id-ID'); }
}
function calcState(x, now) {            // sama dengan perhitungan di server
  if (x.status !== 'Aktif') return 'Nonaktif';
  const a = x.mulaiMs, b = x.selesaiMs;
  if (a == null && b == null) return 'Aktif';
  if (a != null && now < a) return 'Terjadwal';
  if (b != null && now > b) return 'Selesai';
  return 'Berlangsung';
}
const fmtCountdown = s => s >= 86400 ? Math.floor(s / 86400) + ' hari ' + Math.floor(s % 86400 / 3600) + ' jam' : fmtTime(s);

function renderExams() {
  const box = $('#exams'); if (!box) return;
  const now = nowMs();
  const list = S.exams.map(e => ({ ...e, state: e.lanjut ? 'Berlangsung' : calcState({ ...e, status: 'Aktif' }, now) })).filter(e => e.state !== 'Selesai');
  if (!list.length) { box.innerHTML = `<div class="panel p-8 text-center text-slate-400">${icon('calendar-x', 'w-8 h-8 mx-auto mb-3')}Belum ada ujian untuk sekolah Anda. Daftar ini diperbarui otomatis saat guru mengaktifkan atau menjadwalkan ujian.</div>`; paint(); return; }
  box.innerHTML = list.map(e => {
    const wait = e.state === 'Terjadwal';
    const when = [e.mulaiMs ? 'Dibuka ' + fmtWhen(e.mulaiMs, S.tz) : '', e.selesaiMs ? 'Ditutup ' + fmtWhen(e.selesaiMs, S.tz) : ''].filter(Boolean).join(' - ');
    return `<div class="panel p-5 flex items-center gap-4 flex-wrap">
      <span class="w-11 h-11 rounded-xl ${wait ? 'bg-brand/15 text-indigo-300' : 'bg-ok/15 text-emerald-300'} flex items-center justify-center">${icon(wait ? 'calendar-clock' : 'file-pen-line', 'w-5 h-5')}</span>
      <div class="flex-1 min-w-[180px]"><div class="font-bold">${esc(e.nama)}</div>
        <div class="text-xs text-slate-400 mt-1 flex gap-3 flex-wrap"><span>${icon('timer', 'w-3.5 h-3.5 inline -mt-0.5')} ${e.durasi} menit</span><span>${icon('shield-alert', 'w-3.5 h-3.5 inline -mt-0.5')} Batas pelanggaran ${e.batas}</span>${e.kelas ? `<span>${icon('users', 'w-3.5 h-3.5 inline -mt-0.5')} Kelas ${esc(e.kelas)}</span>` : ''}${e.perluToken ? `<span class="text-amber-300">${icon('key-round', 'w-3.5 h-3.5 inline -mt-0.5')} Perlu token</span>` : ''}</div>
        ${when ? `<div class="text-xs text-slate-500 mt-1">${esc(when)} ${esc(S.tzLabel || '')}</div>` : ''}
        ${e.lanjut ? '<div class="text-sm font-semibold text-emerald-300 mt-1">Anda mendapat tambahan waktu. Silakan lanjutkan.</div>' : ''}
        ${wait ? `<div class="text-sm font-semibold text-indigo-300 mt-1" data-cd="${e.mulaiMs}">&nbsp;</div>` : ''}</div>
      ${wait ? `<button class="btn btn-ghost" disabled>${icon('lock', 'w-4 h-4')} Belum dibuka</button>` : `<button class="btn btn-primary" data-start="${esc(e.id)}">${icon('play', 'w-4 h-4')} ${e.lanjut ? 'Lanjutkan ujian' : 'Mulai ujian'}</button>`}</div>`;
  }).join('');
  box.querySelectorAll('[data-start]').forEach(b => b.onclick = () => beginExam(b.dataset.start));
  paint(); tickCountdowns();
}
function tickCountdowns() {
  const els = document.querySelectorAll('[data-cd]'); if (!els.length) return;
  const now = nowMs(); let ready = false;
  els.forEach(el => { const left = Math.ceil((+el.dataset.cd - now) / 1000); if (left <= 0) ready = true; else el.textContent = 'Dibuka dalam ' + fmtCountdown(left); });
  if (ready) { renderExams(); toast('Ujian sudah dibuka. Anda bisa memulai.', 'ok', 4000); }
}

    manual && toast('Daftar ujian diperbarui', 'ok', 1800);

async function beginExam(id, needToken) {
  const e = S.exams.find(x => x.id === id); if (!e) return;
  const fsNote = fsNeeded() ? 'Ujian akan membuka layar penuh.'
    : fsSupported() ? '' : 'Browser ini tidak mendukung layar penuh. Ujian tetap berjalan; berpindah aplikasi atau tab tetap dihitung pelanggaran.';
  const appNote = IN_APP_BROWSER ? `<p class="text-amber-300">Anda membuka lewat aplikasi lain (mis. WhatsApp atau Instagram). Salin tautan lalu buka di Chrome atau Safari agar pemantauan ujian berfungsi.</p>` : '';
  const tokenField = e.perluToken ? `<div class="mt-3"><label class="lbl" for="tok">Token ujian (dari pengawas)</label>
    <input id="tok" class="input font-mono uppercase tracking-widest" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Masukkan token">
    ${needToken ? '' : '<p class="text-xs text-slate-400 mt-1">Jika Anda melanjutkan ujian yang sudah dimulai, token tidak perlu diisi.</p>'}</div>` : '';
  let fsPromise = Promise.resolve(false), tokenVal = '', rootEl = null;
  const go = await ask({
    title: 'Mulai ' + e.nama + '?', ic: 'shield-alert', tone: 'brand',
    body: `<p>Durasi <b>${e.durasi} menit</b>. ${fsNote} Pelanggaran lebih dari <b>${e.batas - 1}</b> kali akan mengunci ujian Anda.</p>${appNote}${tokenField}
           <label class="flex gap-2 items-start mt-3 cursor-pointer"><input type="checkbox" id="agree" class="mt-1 accent-indigo-500"><span>Saya sudah membaca aturan dan siap mengerjakan.</span></label>`,
    actions: [{ id: 'no', label: 'Batal' },
              { id: 'go', label: 'Mulai sekarang', kind: 'btn-primary', disabled: true,
                sync: () => { tokenVal = rootEl ? ((rootEl.querySelector('#tok') || {}).value || '').trim() : ''; if (fsNeeded()) fsPromise = enterFs(); } }],   // layar penuh diminta saat disentuh, sebelum menunggu server
    onOpen: r => {
      rootEl = r; const c = r.querySelector('#agree'), g = r.querySelector('[data-act=go]'), t = r.querySelector('#tok');

  const now = Date.now(); if (now - lastV < 1500) return; lastV = now;       // satu aksi = satu pelanggaran
  X.vio++; updBadge(); logLocal(type);
  const savedP = X.mode === 'internal' ? flushSave(true) : Promise.resolve();      // jawaban disimpan dulu sebelum kemungkinan terkunci
  if (X.vio >= X.batas) lockNow(); else showWarning(type);
  X.inflight++;
  savedP.catch(() => { }).then(() => api('violation', { token: S.token, idUjian: X.id, type, clientViolations: X.vio })).then(syncState).catch(() => { /* offline: heartbeat akan menyinkronkan */ }).finally(() => X && X.inflight--);
}
function showWarning(type) {
  const root = $('#overlay-root'); if (!root) return;
  root.innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"><div class="shake danger-glow rounded-2xl bg-slate-900 p-7 w-full max-w-md text-center">

    <h3 class="mt-4 text-xl font-extrabold text-red-300">Peringatan!</h3>
    <p class="mt-2 text-slate-200">Anda meninggalkan halaman ujian (Pelanggaran ke-${X.vio} dari ${X.batas}).</p>
    <p class="mt-1 text-sm text-slate-400">${esc(type)}. Sisa kesempatan: ${X.batas - X.vio}.</p>
    <button id="warn-ok" class="btn btn-danger w-full mt-6">${icon('rotate-ccw', 'w-4 h-4')} Kembali ke ujian</button></div></div>`;
  paint();
  $('#warn-ok').onclick = () => { root.innerHTML = ''; if (fsNeeded() && !fsEl()) enterFs(); };
}
function lockNow() {
  if (!X || X.locked) return;
  X.locked = true; X.lockedAt = Date.now(); killFrame(); leaveFullscreen(); showEnd('locked');
}
function unlockNow() {
  X.locked = false; $('#overlay-root').innerHTML = ''; setFrame(); updBadge();
  toast('Pengawas telah membuka kunci ujian Anda. Lanjutkan mengerjakan.', 'ok', 6000);
}

  }[kind];
  root.innerHTML = `<div class="fixed inset-0 z-[60] flex items-center justify-center p-6 text-center ${kind === 'locked' ? 'lock-bg' : 'bg-slate-950'}"><div class="pop max-w-lg">

    ${kind === 'timeup' ? '<p class="mt-3 text-sm text-slate-400">Butuh tambahan waktu? Hubungi pengawas. Jika disetujui, tombol Lanjutkan ujian akan muncul di sini.</p><div id="ext-area"></div>' : ''}

function watchExtension() {                      // layar "waktu habis": cek tiap 10 detik apakah pengawas menambah waktu
  clearTimers('ext');
  timers.ext = setInterval(async () => {
    if (!X || !$('#ext-area')) return clearTimers('ext');
    try {
      const r = await api('heartbeat', { token: S.token, idUjian: X.id, clientViolations: X.vio });
      if (r.status === 'Sedang Mengerjakan' && r.remainingSec > 0) { clearTimers('ext'); offerResume(); }
    } catch (e) { if (/Sesi berakhir/.test(e.message)) clearTimers('ext'); }
  }, 10000);
}
function offerResume() {
  const area = $('#ext-area'); if (!area || !X) return;
  area.innerHTML = `<div class="mt-5 p-4 rounded-xl bg-ok/15 border border-emerald-500/40"><p class="text-emerald-200 font-semibold">Pengawas memberi tambahan waktu.</p>
    <button id="resume" class="btn btn-ok mt-3">${icon('play', 'w-4 h-4')} Lanjutkan ujian</button></div>`;
  paint();
  $('#resume').onclick = async () => {
    const id = X.id, fsP = fsNeeded() ? enterFs() : Promise.resolve(false);          // layar penuh diminta saat disentuh
    try {
      const r = await api('startExam', { token: S.token, idUjian: id });
      const fsOk = await fsP;
      if (r.status !== 'Sedang Mengerjakan') { exitFs(); toast('Ujian belum bisa dilanjutkan. Hubungi pengawas.', 'warn'); return; }
      runExam(r, fsOk);
    } catch (e) { exitFs(); toast(e.message, 'err'); }
  };
}

async function confirmFinish() {
  if (!X || X.finished || X.locked) return;
  let body = '<p>Pastikan semua jawaban sudah dikirim pada Google Form. Setelah ini Anda tidak bisa masuk kembali ke ujian ini.</p>';
  if (X.mode === 'internal') {
    const n = X.soal.length, done = X.soal.filter(isAnswered).length, ragu = X.ragu.size;
    body = `<p>Anda menjawab <b>${done}</b> dari <b>${n}</b> soal.${n - done ? ` <span class="text-amber-300">${n - done} soal belum dijawab.</span>` : ''}${ragu ? ` ${ragu} soal ditandai ragu-ragu.` : ''}</p><p>Setelah diselesaikan, Anda tidak bisa kembali ke ujian ini.</p>`;
  }
  const r = await ask({ title: 'Selesaikan ujian?', ic: 'flag', tone: 'ok', body, actions: [{ id: 'no', label: 'Lanjut mengerjakan' }, { id: 'yes', label: 'Ya, selesaikan', kind: 'btn-ok' }] });
  if (r !== 'yes') return;
  X.finished = true; stopGuard(); clearTimers('sv');
  const res = await sendFinal();
  if (!res && X.mode === 'internal') {            // jawaban belum terkirim: jangan akhiri, biarkan peserta mencoba lagi
    X.finished = false; startGuard(); startSaver(); toast('Jawaban belum terkirim. Periksa koneksi lalu tekan Selesai lagi.', 'err', 8000); return;
  }
  if (!res) toast('Status selesai belum tersimpan di server.', 'warn');
  killFrame(); leaveFullscreen(); showEnd('done');
}

/* ---- sinkron dengan server ---- */
async function heartbeat() {
  if (!X || X.finished) return;
  try { syncState(await api('heartbeat', { token: S.token, idUjian: X.id, clientViolations: X.vio })); }
  catch (e) { if (/Sesi berakhir/.test(e.message)) toast('Sesi login berakhir. Jawaban di Google Form tetap aman; login ulang untuk melanjutkan.', 'warn', 8000); }
}
function syncState(r) {
  if (!X || X.finished || !r) return;
  if (typeof r.remainingSec === 'number') { const ne = Date.now() + r.remainingSec * 1000; if (ne - X.endAt > 30000 && !X.locked) toast('Waktu ujian ditambah oleh pengawas.', 'ok', 6000); X.endAt = ne; }
  if (r.batas) X.batas = r.batas;
  if (r.status === 'Terkunci') { X.vio = Math.max(X.vio, r.violations); if (!X.locked) lockNow(); }
  else if (r.status === 'Sedang Mengerjakan') {
    if (X.locked) { if (!X.inflight && Date.now() - X.lockedAt > 12000 && r.violations < X.batas) { X.vio = r.violations; unlockNow(); } }
    else { if (r.violations > X.vio) X.vio = r.violations; if (r.examActive === false) toast('Admin menonaktifkan ujian ini. Hubungi pengawas.', 'warn', 6000); }
  } else if (/^Selesai/.test(r.status || '')) { X.finished = true; stopGuard(); killFrame(); leaveFullscreen(); showEnd(/Waktu/.test(r.status) ? 'timeup' : 'done'); }
  updBadge();
}

function kelasChips() {                          // pilihan cepat dari kelas yang ada di sheet Siswa untuk sekolah terpilih
  const box = $('#x-kelas-chips'); if (!box) return;
  const list = (A.kelas && A.kelas[$('#x-sk').value.trim()]) || [];
  const grades = [...new Set(list.map(k => kelasTokens(k)[0]).filter(t => /^\d+$/.test(t)))].sort((a, b) => a - b);
  const items = [...grades.map(g => ['Kelas ' + g, g]), ...list.map(k => [k, k])];
  const split = v => v.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
  const cur = split($('#x-kelas').value).map(s => s.toLowerCase());
  box.innerHTML = items.length ? items.map(([l, v]) => `<button type="button" data-kc="${esc(v)}" class="badge ${cur.includes(v.toLowerCase()) ? 'b-run' : 'b-off'}">${esc(l)}</button>`).join('')
    : '<span class="text-xs text-slate-500">Pilihan kelas muncul setelah sekolah dipilih (diambil dari sheet Siswa).</span>';
  box.querySelectorAll('[data-kc]').forEach(b => b.onclick = () => {
    const v = b.dataset.kc, arr = split($('#x-kelas').value), i = arr.findIndex(a => a.toLowerCase() === v.toLowerCase());
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
    $('#x-kelas').value = arr.join(', '); kelasChips();
  });
}

let polling = false;
async function loadLogs() {

  try { const r = await api('adminGetLogs', { token: S.token, idUjian: A.filter }); A.logs = r.logs; drawLogs(); }

}
function drawLogs() {
  const body = $('#m-body'); if (!body) return;
  const all = A.logs, cnt = f => all.filter(f).length;
  const cards = [['', 'Semua peserta', all.length, 'text-slate-100'], ['Sedang Mengerjakan', 'Sedang mengerjakan', cnt(x => x.status === 'Sedang Mengerjakan'), 'text-indigo-300'],
                 ['Terkunci', 'Terkunci', cnt(x => x.status === 'Terkunci'), 'text-red-300'], ['Selesai', 'Selesai', cnt(isDone), 'text-emerald-300']];
  $('#m-stats').innerHTML = cards.map(([k, l, v, c]) => `<button type="button" data-sf="${k}" aria-pressed="${A.sf === k}" class="panel p-4 text-left transition ${A.sf === k ? 'ring-2 ring-indigo-400' : 'hover:border-slate-500'}"><div class="text-3xl font-extrabold ${c}">${v}</div><div class="text-xs text-slate-400 mt-1">${l}</div></button>`).join('');
  document.querySelectorAll('#m-stats [data-sf]').forEach(b => b.onclick = () => { A.sf = A.sf === b.dataset.sf ? '' : b.dataset.sf; drawLogs(); });

  const q = norm(A.q).trim().replace(/\s+/g, ' '), terms = q ? q.split(' ') : [];
  const hay = x => norm(`${x.nama} ${x.nomor} ${x.kelas} ${x.sekolah}`);
  let L = all;
  if (q) {                                                                    // frasa utuh diutamakan ("ipa 2" tidak ikut nomor 1002); jika kosong, cari per kata (urutan bebas)
    const phrase = all.filter(x => hay(x).includes(q));
    L = phrase.length ? phrase : all.filter(x => terms.every(t => hay(x).includes(t)));
  }
  if (A.sf) L = L.filter(x => A.sf === 'Selesai' ? isDone(x) : x.status === A.sf);
  L.sort((a, b) => statusRank(a.status) - statusRank(b.status) || String(a.nama).localeCompare(String(b.nama), 'id'));   // terkunci paling atas
  const filtered = terms.length > 0 || !!A.sf;
  $('#m-count').innerHTML = filtered
    ? `Menampilkan <b class="text-slate-200">${L.length}</b> dari ${all.length} peserta <button type="button" class="underline ml-2 text-indigo-300" id="m-clear">Hapus filter</button>`

    <td>${esc(name(x.idUjian))}</td><td><b class="${x.pelanggaran ? 'text-amber-300' : ''}">${x.pelanggaran}</b> / ${max}${x.terakhir ? `<div class="text-xs text-slate-500">${esc(x.terakhir)}</div>` : ''}</td>
    <td><span class="badge ${cls}">${x.status === 'Sedang Mengerjakan' && x.online ? '<span class="pulse-dot" style="--c:#818CF8"></span>' : ''}${esc(x.status)}</span>${(x.sisaSec != null || x.tambahan) ? `<div class="text-xs text-slate-500 mt-1">${[x.sisaSec != null ? 'Sisa ' + fmtTime(x.sisaSec) : '', x.tambahan ? '+' + x.tambahan + ' mnt' : ''].filter(Boolean).join(' - ')}</div>` : ''}</td>
    <td class="text-slate-400">${x.online ? 'Online' : fmtAgo(x.seenAgo)}</td>
    <td class="text-right whitespace-nowrap">${x.status === 'Terkunci' ? `<button class="btn btn-ghost btn-sm" data-un="${esc(x.idUjian)}|${esc(x.nomor)}">${icon('lock-open', 'w-4 h-4')} Buka kunci</button> ` : ''}<button class="btn btn-ghost btn-sm" data-tw="${esc(x.idUjian)}|${esc(x.nomor)}" title="Tambah waktu">${icon('timer-reset', 'w-4 h-4')} Waktu</button></td></tr>`;
  }).join('') : `<tr><td colspan="7" class="text-center text-slate-500 py-8">${all.length ? 'Tidak ada peserta yang cocok dengan pencarian atau filter ini.' : 'Belum ada peserta yang memulai ujian.'}</td></tr>`;
  paint();
  body.querySelectorAll('[data-tw]').forEach(b => b.onclick = async () => {
    const [idUjian, nomor] = b.dataset.tw.split('|'), x = A.logs.find(v => v.idUjian === idUjian && v.nomor === nomor); if (!x) return;
    const note = /^Selesai/.test(x.status) ? 'Peserta ini sudah selesai atau waktunya habis. Ujian akan dibuka kembali dengan sisa waktu sebesar tambahan ini.'
      : x.status === 'Terkunci' ? 'Peserta masih terkunci. Waktu bertambah, tetapi buka kunci agar ia bisa melanjutkan.' : 'Waktu ditambahkan pada sisa waktu peserta saat ini.';
    let menit = 0, alasan = '', rootEl = null;
    const r = await ask({ title: 'Tambah waktu', ic: 'timer-reset', tone: 'brand',
      body: `<p><b>${esc(x.nama)}</b> (${esc(x.kelas)}) - ${esc(name(x.idUjian))}</p>
        <div class="flex flex-wrap gap-2 mt-3">${[5, 10, 15, 30, 60].map(m => `<button type="button" class="btn btn-ghost btn-sm" data-m="${m}">+${m} menit</button>`).join('')}</div>

    if (r !== 'yes') return;
    if (!(menit >= 1 && menit <= 240)) { toast('Isi tambahan waktu 1 sampai 240 menit.', 'err'); return; }
    try {
      const res = await api('adminAddTime', { token: S.token, idUjian, nomor, menit, alasan });

      if (res.peringatan) toast(res.peringatan, 'warn', 8000);

    } catch (e) { toast(e.message, 'err'); }
  });
  body.querySelectorAll('[data-un]').forEach(b => b.onclick = async () => {
    const [idUjian, nomor] = b.dataset.un.split('|');

    if (r !== 'yes') return;
    try { await api('adminUnlock', { token: S.token, idUjian, nomor }); toast('Kunci dibuka', 'ok'); loadLogs(); } catch (e) { toast(e.message, 'err'); }
  });

const fmtAgo = s => s == null || s > 86400 * 30 ? '-' : s < 60 ? s + ' dtk lalu' : s < 3600 ? Math.floor(s / 60) + ' mnt lalu' : Math.floor(s / 3600) + ' jam lalu';

const JENIS = { PG: ['Pilihan ganda', 'b-run'], PGK: ['Pilihan ganda kompleks', 'b-lock'], BS: ['Benar / Salah', 'b-done'], ESSAY: ['Essay', 'b-off'] };
const newQid = () => 'Q-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
const letterOf = (q, id) => { const i = (q.opsi || []).findIndex(o => o.id === id); return i < 0 ? '?' : String.fromCharCode(65 + i); };
function keySummary(q) {
  if (q.jenis === 'PG') return 'Kunci: ' + letterOf(q, q.kunci);
  if (q.jenis === 'PGK') return 'Kunci: ' + (q.kunci || []).map(id => letterOf(q, id)).join(', ') + ' - ' + (q.aturan === 'sebagian' ? 'nilai sebagian' : 'harus benar semua');
  if (q.jenis === 'BS') return 'Kunci: ' + q.opsi.map((o, i) => (i + 1) + (q.kunci[o.id] === 'B' ? ' Benar' : ' Salah')).join(', ') + ' - ' + (q.aturan === 'semua' ? 'semua harus benar' : 'nilai per pernyataan');
  return 'Dinilai manual oleh guru';
}

    <div class="flex flex-col gap-1 flex-none">
      <div class="flex gap-1"><button class="btn btn-ghost btn-sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Naikkan">${icon('chevron-up', 'w-4 h-4')}</button><button class="btn btn-ghost btn-sm" data-dn="${i}" ${i === A.soal.length - 1 ? 'disabled' : ''} aria-label="Turunkan">${icon('chevron-down', 'w-4 h-4')}</button></div>
      <div class="flex gap-1"><button class="btn btn-ghost btn-sm" data-ed="${i}" aria-label="Ubah">${icon('pencil', 'w-4 h-4')}</button><button class="btn btn-ghost btn-sm" data-cp="${i}" aria-label="Gandakan">${icon('copy', 'w-4 h-4')}</button><button class="btn btn-ghost btn-sm" data-rm="${i}" aria-label="Hapus">${icon('trash-2', 'w-4 h-4 text-red-400')}</button></div></div></div>`).join('');
  paint(); fillImgs(list);
  const move = async (i, d) => {
    const j = i + d; if (j < 0 || j >= A.soal.length) return;
    const before = A.soal.slice(); [A.soal[i], A.soal[j]] = [A.soal[j], A.soal[i]]; drawSoalList();
    try { const r = await api('adminReorderSoal', { token: S.token, idUjian: A.curExam, ids: A.soal.map(q => q.id) }); A.soal = r.soal; }
    catch (e) { A.soal = before; drawSoalList(); toast('Urutan tidak berubah. ' + e.message, 'err'); }
  };
  list.querySelectorAll('[data-up]').forEach(b => b.onclick = () => move(+b.dataset.up, -1));
  list.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => move(+b.dataset.dn, 1));
  list.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editSoal(A.soal[+b.dataset.ed]));
  list.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => {
    const q = A.soal[+b.dataset.cp];
    try { const r = await api('adminSaveSoal', { token: S.token, idUjian: A.curExam, soal: { ...q, id: newQid() } }); A.soal = r.soal; drawSoalList(); toast('Soal digandakan di urutan terakhir', 'ok', 2500); } catch (e) { toast(e.message, 'err'); }
  });
  list.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const q = A.soal[+b.dataset.rm], no = +b.dataset.rm + 1;
    const r = await ask({ title: 'Hapus soal ' + no + '?', ic: 'trash-2', tone: 'bad', body: '<p>Soal dihapus dari ujian. Jawaban peserta untuk soal ini tidak lagi dihitung.</p>', actions: [{ id: 'no', label: 'Batal' }, { id: 'yes', label: 'Hapus', kind: 'btn-danger' }] });
    if (r !== 'yes') return;
    try { const res = await api('adminDeleteSoal', { token: S.token, idUjian: A.curExam, id: q.id }); A.soal = res.soal; drawSoalList(); toast('Soal dihapus', 'ok', 2000); } catch (e) { toast(e.message, 'err'); }
  });
}

/* ---------- editor soal: toolbar matematika, gambar, pratinjau langsung ---------- */
function editSoal(q, kind) {
  const mk = id => ({ id, t: '', g: '' });
  let E = q ? JSON.parse(JSON.stringify(q)) : (() => {
    const k = kind;
    return { id: '', jenis: k, teks: '', gambar: '', bobot: k === 'ESSAY' ? 10 : k === 'PGK' ? 2 : 1, aturan: k === 'PGK' ? 'semua' : k === 'BS' ? 'per' : '',
      opsi: k === 'ESSAY' ? [] : k === 'BS' ? [mk('s1'), mk('s2')] : [mk('a'), mk('b'), mk('c'), mk('d')],
      kunci: k === 'PG' ? 'a' : k === 'PGK' ? [] : k === 'BS' ? { s1: 'B', s2: 'S' } : '' };
  })();
  const bs = E.jenis === 'BS', maxOpt = bs ? 10 : 8, minOpt = bs ? 1 : 2;
  const ids = bs ? Array.from({ length: 10 }, (_, i) => 's' + (i + 1)) : 'abcdefgh'.split('');
  let palTab = 0, lastKey = '', pvT = null;
  const getLast = () => { if (!lastKey) return null; if (lastKey === 'e-teks' || lastKey === 'e-kunci') return root.querySelector('#' + lastKey); return root.querySelector('[data-oi="' + lastKey.split(':')[1] + '"]'); };
  const root = document.createElement('div');
  root.className = 'fixed inset-0 z-[70] overflow-y-auto bg-slate-950/95 backdrop-blur-sm';
  $('#modal-root').appendChild(root);
  const close = () => { root.remove(); };
  const sched = () => { clearTimeout(pvT); pvT = setTimeout(renderPreview, 180); };

  function imgCtl(target, id) {
    return id
      ? `<div class="flex items-center gap-2 mt-2"><div class="rounded-lg overflow-hidden bg-white flex-none">${imgHtml(id, '!max-h-20 !mt-0 w-auto')}</div><button type="button" class="btn btn-ghost btn-sm" data-rmimg="${target}">${icon('x', 'w-4 h-4')} Hapus gambar</button></div>`
      : `<div class="mt-2"><button type="button" class="btn btn-ghost btn-sm" data-pick="${target}">${icon('image-plus', 'w-4 h-4')} Tambah gambar</button><input type="file" accept="image/*" class="hidden" data-file="${target}"></div>`;
  }
  function draw() {
    const title = (q ? 'Ubah soal' : 'Tambah soal') + ' - ' + JENIS[E.jenis][0];
    const opts = (E.jenis === 'ESSAY') ? '' : `<div class="space-y-2" id="e-opts"><div class="lbl">${bs ? 'Pernyataan (tentukan Benar atau Salah)' : E.jenis === 'PG' ? 'Pilihan jawaban (pilih satu kunci)' : 'Pilihan jawaban (centang semua kunci)'}</div>
      ${E.opsi.map((o, i) => {
        const key = bs ? `<div class="flex gap-1 flex-none"><button type="button" class="btn btn-sm ${E.kunci[o.id] === 'B' ? 'btn-ok' : 'btn-ghost'}" data-bs="${o.id}:B">Benar</button><button type="button" class="btn btn-sm ${E.kunci[o.id] === 'S' ? 'btn-danger' : 'btn-ghost'}" data-bs="${o.id}:S">Salah</button></div>`
          : E.jenis === 'PG' ? `<input type="radio" name="e-key" class="accent-emerald-500 w-5 h-5 flex-none mt-2" data-key="${o.id}" ${E.kunci === o.id ? 'checked' : ''} aria-label="Kunci ${String.fromCharCode(65 + i)}">`
          : `<input type="checkbox" class="accent-emerald-500 w-5 h-5 flex-none mt-2" data-key="${o.id}" ${(E.kunci || []).includes(o.id) ? 'checked' : ''} aria-label="Kunci ${String.fromCharCode(65 + i)}">`;
        return `<div class="panel p-3 flex gap-3 items-start"><div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-sm font-bold flex-none mt-1">${bs ? i + 1 : String.fromCharCode(65 + i)}</div>
          <div class="flex-1 min-w-0"><textarea class="input rich-field" rows="2" data-oi="${i}" data-imgt="o:${i}" placeholder="${bs ? 'Tulis pernyataan' : 'Tulis pilihan jawaban'}">${esc(o.t)}</textarea>${imgCtl('o:' + i, o.g)}</div>${key}
          <button type="button" class="btn btn-ghost btn-sm flex-none" data-del="${i}" ${E.opsi.length <= minOpt ? 'disabled' : ''} aria-label="Hapus">${icon('trash-2', 'w-4 h-4 text-red-400')}</button></div>`;
      }).join('')}
      <button type="button" class="btn btn-ghost btn-sm" data-addopt ${E.opsi.length >= maxOpt ? 'disabled' : ''}>${icon('plus', 'w-4 h-4')} Tambah ${bs ? 'pernyataan' : 'pilihan'}</button></div>`;
    const aturan = E.jenis === 'PGK' ? `<div><label class="lbl" for="e-aturan">Aturan nilai</label><select id="e-aturan" class="input"><option value="semua" ${E.aturan === 'semua' ? 'selected' : ''}>Harus benar semua baru mendapat nilai</option><option value="sebagian" ${E.aturan === 'sebagian' ? 'selected' : ''}>Nilai sebagian (benar dikurangi salah)</option></select></div>`
      : bs ? `<div><label class="lbl" for="e-aturan">Aturan nilai</label><select id="e-aturan" class="input"><option value="per" ${E.aturan === 'per' ? 'selected' : ''}>Nilai per pernyataan yang benar</option><option value="semua" ${E.aturan === 'semua' ? 'selected' : ''}>Semua pernyataan harus benar</option></select></div>` : '';
    const ess = E.jenis === 'ESSAY' ? `<div><label class="lbl" for="e-kunci">Pedoman penilaian (hanya terlihat oleh guru)</label><textarea id="e-kunci" class="input rich-field" rows="3" placeholder="Poin-poin jawaban yang diharapkan">${esc(E.kunci || '')}</textarea></div>` : '';
    root.innerHTML = `<div class="max-w-6xl mx-auto p-4 sm:p-6">
      <div class="flex items-center gap-3 mb-4"><h2 class="text-xl font-bold flex-1">${esc(title)}</h2><button type="button" class="btn btn-ghost btn-sm" data-close>${icon('x', 'w-4 h-4')} Tutup</button></div>
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="space-y-4">
          <div class="panel p-3"><div id="e-palbar" class="flex flex-wrap gap-1 mb-2"></div><div id="e-palbtns" class="flex flex-wrap gap-1.5"></div>
            <p class="text-xs text-slate-500 mt-2">Klik kolom teks lalu pilih simbol. Rumus ditulis di antara tanda $, misalnya $x^2+1$. Gambar bisa ditempel (Ctrl+V), diseret, atau dipilih dari tombol Tambah gambar.</p></div>
          <div><label class="lbl" for="e-teks">Pertanyaan</label><textarea id="e-teks" class="input rich-field" rows="5" data-imgt="q" placeholder="Tulis pertanyaan di sini">${esc(E.teks)}</textarea>${imgCtl('q', E.gambar)}</div>
          ${opts}${aturan}${ess}
          <div class="grid grid-cols-2 gap-3"><div><label class="lbl" for="e-bobot">Bobot (poin)</label><input id="e-bobot" type="number" min="0.5" max="100" step="0.5" class="input" value="${E.bobot}"></div></div>
          <div class="flex gap-2"><button type="button" class="btn btn-primary flex-1" id="e-save">${icon('save', 'w-4 h-4')} Simpan soal</button><button type="button" class="btn btn-ghost" data-close>Batal</button></div></div>
        <div class="lg:sticky lg:top-4 h-fit"><div class="text-sm font-semibold text-slate-300 mb-2">Pratinjau (kunci ditandai hijau)</div><div id="e-prev" class="panel p-5"></div></div></div></div>`;
    paint(); fillImgs(root); bind(); drawPal(); renderPreview();
    loadImages([E.gambar, ...E.opsi.map(o => o.g)], undefined, root);
  }
  function drawPal() {                                  // palet dirender terpisah agar kolom yang sedang diketik tidak hilang
    root.querySelector('#e-palbar').innerHTML = PALETTE.map((pl, i) => `<button type="button" class="badge ${i === palTab ? 'b-run' : 'b-off'}" data-pal="${i}">${pl[0]}</button>`).join('')
      + `<span class="mx-1 w-px bg-slate-700"></span><button type="button" class="btn btn-ghost btn-sm !px-2.5 font-bold" data-fmt="**‸**" title="Tebal">B</button><button type="button" class="btn btn-ghost btn-sm !px-2.5 underline" data-fmt="__‸__" title="Garis bawah">U</button>`;
    root.querySelector('#e-palbtns').innerHTML = PALETTE[palTab][1].map(([l, t], i) => `<button type="button" class="btn btn-ghost btn-sm !px-2.5 font-mono" data-sym="${i}" title="${esc(t)}">${esc(l)}</button>`).join('');
    const target = () => getLast() || root.querySelector('#e-teks');
    root.querySelectorAll('[data-pal]').forEach(b => { b.onmousedown = ev => ev.preventDefault(); b.onclick = () => { palTab = +b.dataset.pal; drawPal(); }; });
    root.querySelectorAll('[data-sym]').forEach(b => { b.onmousedown = ev => ev.preventDefault(); b.onclick = () => insertSnippet(target(), PALETTE[palTab][1][+b.dataset.sym][1], true); });
    root.querySelectorAll('[data-fmt]').forEach(b => { b.onmousedown = ev => ev.preventDefault(); b.onclick = () => insertSnippet(target(), b.dataset.fmt, false); });
  }
  function renderPreview() {
    const box = root.querySelector('#e-prev'); if (!box) return;
    const L = i => String.fromCharCode(65 + i);
    let h = `<div class="rich text-base">${richHtml(E.teks) || '<span class="text-slate-500">Pertanyaan akan tampil di sini</span>'}</div>${imgHtml(E.gambar)}<div class="mt-3 space-y-2">`;
    if (E.jenis === 'PG' || E.jenis === 'PGK') h += E.opsi.map((o, i) => { const on = E.jenis === 'PG' ? E.kunci === o.id : (E.kunci || []).includes(o.id);
      return `<div class="opt ${E.jenis === 'PGK' ? 'opt-sq' : ''} ${on ? 'opt-key' : ''}"><span class="opt-mark">${L(i)}</span><span class="flex-1 rich">${richHtml(o.t) || '<span class="text-slate-500">-</span>'}${imgHtml(o.g)}</span>${on ? icon('check', 'w-5 h-5 text-emerald-300') : ''}</div>`; }).join('');
    else if (bs) h += E.opsi.map((o, i) => `<div class="panel p-3 flex gap-3 items-start"><span class="text-slate-400 font-bold">${i + 1}.</span><div class="flex-1 rich">${richHtml(o.t) || '<span class="text-slate-500">-</span>'}${imgHtml(o.g)}</div><span class="badge ${E.kunci[o.id] === 'B' ? 'b-done' : 'b-lock'}">${E.kunci[o.id] === 'B' ? 'Benar' : 'Salah'}</span></div>`).join('');
    else h += `<textarea class="input" rows="4" disabled placeholder="Siswa mengetik jawaban essay di sini"></textarea>${E.kunci ? `<div class="mt-2 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-sm"><div class="text-xs text-emerald-300 mb-1">Pedoman guru</div><div class="rich">${richHtml(E.kunci)}</div></div>` : ''}`;
    box.innerHTML = h + '</div>'; paint(); fillImgs(box);
  }
  async function attach(target, file) {
    try {
      toast('Mengunggah gambar...', 'info', 1500);
      const id = await uploadImage(file);
      if (target === 'q') E.gambar = id; else E.opsi[+target.split(':')[1]].g = id;
      draw();
    } catch (e) { toast(e.message, 'err'); }
  }
  function bind() {
    root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    root.querySelectorAll('.rich-field').forEach(f => f.addEventListener('focusin', () => { lastKey = f.id || ('oi:' + f.dataset.oi); }));
    const teks = root.querySelector('#e-teks'); teks.oninput = () => { E.teks = teks.value; sched(); };
    root.querySelectorAll('[data-oi]').forEach(f => f.oninput = () => { E.opsi[+f.dataset.oi].t = f.value; sched(); });
    const kk = root.querySelector('#e-kunci'); if (kk) kk.oninput = () => { E.kunci = kk.value; sched(); };
    const bo = root.querySelector('#e-bobot'); bo.oninput = () => { E.bobot = bo.value; };
    const at = root.querySelector('#e-aturan'); if (at) at.onchange = () => { E.aturan = at.value; };
    root.querySelectorAll('[data-key]').forEach(b => b.onchange = () => {
      if (E.jenis === 'PG') E.kunci = b.dataset.key;
      else { const s = new Set(E.kunci || []); b.checked ? s.add(b.dataset.key) : s.delete(b.dataset.key); E.kunci = [...s]; }
      sched();
    });
    root.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => { const [id, v] = b.dataset.bs.split(':'); E.kunci[id] = v; draw(); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const o = E.opsi.splice(+b.dataset.del, 1)[0];
      if (E.jenis === 'PG' && E.kunci === o.id) E.kunci = E.opsi[0].id; else if (E.jenis === 'PGK') E.kunci = (E.kunci || []).filter(x => x !== o.id); else if (bs) delete E.kunci[o.id];
      draw();
    });
    const add = root.querySelector('[data-addopt]'); if (add) add.onclick = () => {
      const id = ids.find(x => !E.opsi.some(o => o.id === x)); if (!id) return;
      E.opsi.push(mk(id)); if (bs) E.kunci[id] = 'B'; draw();
    };
    root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => b.parentElement.querySelector('input[type=file]').click());
    root.querySelectorAll('input[data-file]').forEach(f => f.onchange = () => { if (f.files[0]) attach(f.dataset.file, f.files[0]); });
    root.querySelectorAll('[data-rmimg]').forEach(b => b.onclick = () => { const t = b.dataset.rmimg; if (t === 'q') E.gambar = ''; else E.opsi[+t.split(':')[1]].g = ''; draw(); });
    root.querySelectorAll('[data-imgt]').forEach(f => {
      f.addEventListener('paste', ev => { const it = [...(ev.clipboardData ? ev.clipboardData.items : [])].find(i => i.type.indexOf('image/') === 0); if (it) { ev.preventDefault(); attach(f.dataset.imgt, it.getAsFile()); } });
      f.addEventListener('dragover', ev => ev.preventDefault());
      f.addEventListener('drop', ev => { const file = ev.dataTransfer && ev.dataTransfer.files[0]; if (file && /^image\//.test(file.type)) { ev.preventDefault(); attach(f.dataset.imgt, file); } });
    });
    root.querySelector('#e-save').onclick = save;
  }
  async function save() {
    const btn = root.querySelector('#e-save'); busy(btn, true, 'Menyimpan...');
    if (!E.id) E.id = newQid();                                         // dibuat di sini agar pengulangan tidak menggandakan soal
    const soal = { id: E.id, jenis: E.jenis, teks: E.teks, gambar: E.gambar, bobot: Number(E.bobot), aturan: E.aturan, opsi: E.opsi, kunci: E.kunci };
    try {
      const r = await api('adminSaveSoal', { token: S.token, idUjian: A.curExam, soal });
      A.soal = r.soal; close(); drawSoalList(); toast('Soal tersimpan', 'ok', 2000);
    } catch (e) { toast(e.message, 'err'); busy(btn, false); }
  }
  draw();
}

async function renderHasil() {
  const ex = A.exams.find(x => x.id === A.curExam); if (!ex) return setTab('ujian');
  $('#tab').innerHTML = `<div class="space-y-4">
    <div class="flex items-center gap-3 flex-wrap"><button id="hs-back" class="btn btn-ghost btn-sm">${icon('arrow-left', 'w-4 h-4')} Daftar ujian</button>
      <div><div class="text-lg font-bold">Hasil: ${esc(ex.nama)}</div><div class="text-xs text-slate-400">${esc(ex.sekolah)}</div></div>
      <div class="ml-auto flex gap-2 flex-wrap"><button id="hs-soal" class="btn btn-ghost btn-sm">${icon('list-checks', 'w-4 h-4')} Kelola soal</button>
        <button id="hs-ref" class="btn btn-ghost btn-sm">${icon('refresh-cw', 'w-4 h-4')} Muat ulang</button><button id="hs-csv" class="btn btn-primary btn-sm">${icon('download', 'w-4 h-4')} Unduh CSV</button></div></div>
    <div id="hs-body"><div class="panel p-8 text-center text-slate-400">Memuat hasil...</div></div></div>`;
  paint();
  $('#hs-back').onclick = () => setTab('ujian'); $('#hs-soal').onclick = () => openSoal(ex.id);
  $('#hs-ref').onclick = loadHasil; $('#hs-csv').onclick = unduhCsv;
  loadHasil();
}
async function loadHasil() {
  try { A.hasil = await api('adminGetHasil', { token: S.token, idUjian: A.curExam }); drawHasil(); }
  catch (e) { toast(e.message, 'err'); const b = $('#hs-body'); if (b) b.innerHTML = `<div class="panel p-8 text-center text-red-300">${esc(e.message)}</div>`; }
}
function drawHasil() {
  const r = A.hasil, box = $('#hs-body'); if (!r || !box) return;
  const rows = r.rows.slice().sort((a, b) => String(a.nama).localeCompare(String(b.nama), 'id'));
  const nil = rows.map(x => x.nilai), avg = nil.length ? Math.round(nil.reduce((s, v) => s + v, 0) / nil.length * 10) / 10 : 0, pend = rows.reduce((s, x) => s + x.belum, 0);
  const stat = [['Peserta', rows.length], ['Rata-rata nilai', avg], ['Tertinggi', nil.length ? Math.max(...nil) : 0], ['Terendah', nil.length ? Math.min(...nil) : 0], ['Essay menunggu nilai', pend]];
  box.innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">${stat.map(([l, v]) => `<div class="panel p-3"><div class="text-2xl font-extrabold ${l.startsWith('Essay') && v ? 'text-amber-300' : ''}">${v}</div><div class="text-xs text-slate-400">${l}</div></div>`).join('')}</div>
    <section class="panel p-4 overflow-x-auto"><table class="t"><thead><tr><th>Peserta</th><th>Kelas</th><th>Status</th><th>Skor otomatis</th><th>Essay</th><th>Total</th><th>Nilai</th><th></th></tr></thead><tbody>
    ${rows.length ? rows.map(x => `<tr><td><div class="font-semibold">${esc(x.nama)}</div><div class="text-xs text-slate-500">${esc(x.nomor)}</div></td><td>${esc(x.kelas)}</td>
      <td><span class="badge ${x.status === 'Terkunci' ? 'b-lock' : x.status === 'Sedang Mengerjakan' ? 'b-run' : 'b-done'}">${esc(x.status)}</span>${x.pelanggaran ? `<div class="text-xs text-amber-300 mt-1">${x.pelanggaran} pelanggaran</div>` : ''}</td>
      <td>${x.auto}</td><td>${x.belum ? `<span class="badge b-lock">${x.belum} belum dinilai</span>` : x.essay}</td><td>${x.total} / ${x.maks}</td><td class="font-extrabold">${x.nilai}</td>
      <td class="text-right whitespace-nowrap"><button class="btn btn-ghost btn-sm" data-jw="${esc(x.nomor)}">${icon('eye', 'w-4 h-4')} Jawaban</button></td></tr>`).join('')
      : `<tr><td colspan="8" class="text-center text-slate-500 py-8">Belum ada peserta yang mengerjakan.</td></tr>`}</tbody></table></section>
    <h3 class="text-lg font-bold mt-6 mb-2">Analisis butir soal</h3>
    <section class="panel p-4 overflow-x-auto"><table class="t"><thead><tr><th>No</th><th>Jenis</th><th>Soal</th><th>Benar</th><th>Sebagian</th><th>Salah</th><th>Kosong</th><th>Tingkat benar</th></tr></thead><tbody>
    ${r.soal.map(s => { const t = s.stat, n = t.n || 0, pct = s.jenis === 'ESSAY' ? null : n ? Math.round(t.benar / n * 100) : 0;

/* Validasi soal dari guru. Mengembalikan soal bersih atau melempar pesan galat yang jelas. */
function cleanSoal_(s) {

    const src = Array.isArray(s.opsi) ? s.opsi : [], bs = jenis === 'BS', seen = {};

/* Penilaian satu soal otomatis (essay dinilai guru). */
function gradeSoal_(q, ans) {
  const maks = Number(q.bobot) || 0;
